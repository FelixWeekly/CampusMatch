<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusMatch | 登录</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <main class="auth-shell" style="position:relative;">
        <button id="language-toggle" type="button" class="cm-button ghost" onclick="toggleAuthLanguage()" style="position:absolute;top:24px;right:24px;min-height:36px;padding:0 12px;font-size:13px;z-index:2;">
            EN
        </button>
        <section class="auth-visual" aria-label="CampusMatch 连结 · 成长 · 无限可能">
            <a class="cm-brand" href="index.html">
                <span class="cm-brand-mark">
                    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">diversity_3</span>
                </span>
                <span>
                    <span class="cm-brand-title">CampusMatch</span>
                    <span class="cm-brand-subtitle">连结 · 成长 · 无限可能</span>
                </span>
            </a>

            <div class="auth-copy">
                <span class="cm-chip success">快捷协作</span>
                <h1>为多人任务或活动找到合适搭档。</h1>
                <p>和同学交流、发布需求、加入项目，让合作在一个专注的空间里持续推进。</p>
                <a href="https://github.com/FelixWeekly/CampusMatch" target="_blank" class="auth-github-link">了解更多 <span class="material-symbols-outlined" style="font-size:14px;vertical-align:middle;">arrow_forward</span></a>
            </div>
        </section>

        <section class="auth-main">
            <div class="auth-container animate-spring">
                <div class="auth-tabs" role="tablist" aria-label="身份验证">
                    <button class="auth-tab active" type="button" onclick="switchForm('login')">登录</button>
                    <button class="auth-tab" type="button" onclick="switchForm('register')">注册</button>
                    <button class="auth-tab" type="button" onclick="switchForm('reset')">重置</button>
                </div>

                <div id="login-box" class="form-box">
                    <h2>欢迎回来！</h2>
                    <p class="subtitle">请先登录</p>

                    <div class="field-stack">
                        <label class="form-label" for="login-email">邮箱</label>
                        <input type="email" id="login-email" placeholder="邮箱地址">
                        <label class="form-label" for="login-password">密码</label>
                        <input type="password" id="login-password" placeholder="请输入密码">
                        <button type="button" onclick="login()">
                            登录
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                    </div>

                    <p class="switch-text">还没有账号？ <span onclick="switchForm('register')">创建账号</span> · <span onclick="switchForm('reset')">忘记密码</span></p>
                </div>

                <div id="register-box" class="form-box hidden">
                    <h2>创建账号</h2>
                    <p class="subtitle">从建立你的身份开始</p>

                    <div class="field-stack">
                        <label class="form-label" for="reg-name">姓名</label>
                        <input type="text" id="reg-name" placeholder="姓名或昵称">
                        <label class="form-label" for="reg-email">邮箱</label>
                        <input type="email" id="reg-email" placeholder="邮箱地址">
                        <label class="form-label" for="reg-code">验证码</label>
                        <div class="field-with-button">
                            <input type="text" id="reg-code" placeholder="验证码">
                            <button type="button" class="cm-button ghost" onclick="sendCode('reg-email')">获取验证码</button>
                        </div>
                        <label class="form-label" for="reg-password">密码</label>
                        <input type="password" id="reg-password" placeholder="设置密码">
                        <button type="button" onclick="register()">创建账号</button>
                    </div>

                    <p class="switch-text">已经有账号了？ <span onclick="switchForm('login')">登录</span></p>
                </div>

                <div id="reset-box" class="form-box hidden">
                    <h2>重置密码</h2>
                    <p class="subtitle">验证邮箱并设置新密码</p>

                    <div class="field-stack">
                        <label class="form-label" for="reset-email">邮箱</label>
                        <input type="email" id="reset-email" placeholder="邮箱地址">
                        <label class="form-label" for="reset-code">验证码</label>
                        <div class="field-with-button">
                            <input type="text" id="reset-code" placeholder="验证码">
                            <button type="button" class="cm-button ghost" onclick="sendCode('reset-email')">获取验证码</button>
                        </div>
                        <label class="form-label" for="reset-password">新密码</label>
                        <input type="password" id="reset-password" placeholder="新密码">
                        <button type="button" onclick="resetPassword()">重置密码</button>
                    </div>

                    <p class="switch-text">想起来了？ <span onclick="switchForm('login')">返回登录</span></p>
                </div>
            </div>

        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>

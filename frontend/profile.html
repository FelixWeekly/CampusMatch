<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页 - CampusTasker</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #f9fafb; 
            min-height: 100vh;
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; /* 为绝对定位提供参照物 */
            overflow-x: hidden;
        }

        /* 🌟 真正的“悬浮左上角”返回按钮！绝对不挤占其他元素空间 */
        .back-btn-custom {
            position: absolute;
            top: 20px;
            left: 20px;
            width: fit-content; /* 宽度仅包裹内容 */
            padding: 8px 16px;
            background-color: #000000;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s; /* 变色动画 */
            z-index: 1000;
        }

        .back-btn-custom:hover {
            background-color: #e2e6ea; /* 鼠标移上去变深一点 */
       }

        /* 独立居中的标题 */
        .profile-title {
            margin-top: 40px;
            margin-bottom: 20px;
            font-size: 32px;
            color: #111827;
            text-align: center;
        }

        /* 卡片容器布局 */
        .profile-container {
            width: min(1000px, calc(100vw - 40px));
            padding: 0 0 40px 0;
            box-sizing: border-box;
            display: grid; 
            grid-template-columns: 1fr 2fr; 
            gap: 30px; 
            align-items: start;
        }
        
        /* 左侧个人信息卡片 */
        .info-card { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); text-align: center; }
        .avatar { width: 120px; height: 120px; background-color: #e5e7eb; border-radius: 50%; margin: 0 auto 20px; font-size: 50px; display: flex; align-items: center; justify-content: center; color: #9ca3af; }
        .user-name { font-size: 26px; color: #111827; margin-bottom: 5px; }
        .user-tags { color: #6b7280; font-size: 14px; margin-bottom: 20px; }
        .user-bio { color: #4b5563; font-size: 15px; line-height: 1.6; margin-bottom: 20px; padding: 15px; background: #f9fafb; border-radius: 8px; text-align: left; }
        .skills-container { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 20px; }
        .skill-tag { background: #eff6ff; color: #2563eb; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; }
        .portfolio-link { display: inline-block; color: #10b981; text-decoration: none; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
        .portfolio-link:hover { text-decoration: underline; }

        /* 右侧评价卡片 */
        .reviews-card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); }
        .rating-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e5e7eb; padding-bottom: 20px; margin-bottom: 20px; }
        .average-score { font-size: 32px; font-weight: bold; color: #f59e0b; }
        .review-item { padding: 15px 0; border-bottom: 1px dashed #e5e7eb; }
        .review-item:last-child { border-bottom: none; }
        .stars { color: #f59e0b; letter-spacing: 2px; }
        .activity-board { margin-top: 18px; padding-top: 16px; border-top: 1px solid #eef2f7; }
        .activity-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        .activity-col { background:#f8fafc; border:1px solid #e2e8f0; border-radius:10px; padding:12px; }
        .activity-item { padding:8px 0; border-bottom:1px dashed #e5e7eb; }
        .activity-item:last-child { border-bottom:none; }
        @media (max-width: 920px) {
            .profile-container { grid-template-columns: 1fr; }
            .activity-grid { grid-template-columns: 1fr; }
        }

        /* 模态框通用样式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal-content { background: white; padding: 30px; border-radius: 16px; width: 90%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 15px; background-color: #f9fafb; }
    </style>
</head>
<body>

    <!-- 🌟 死死钉在屏幕左上角的悬浮返回键 -->
    <button class="back-btn-custom" onclick="location.href='dashboard.html'">← 返回大厅</button>

    <!-- 独立的标题 -->
    <h1 class="profile-title">🎓 个人主页</h1>

    <div class="profile-container">
        <div class="info-card">
            <div class="avatar" id="avatar-text">👤</div>
            <h2 class="user-name" id="display-name">加载中...</h2>
            <p class="user-tags" id="display-dept-grade">院系年级加载中...</p>
            <p class="user-tags" id="display-campus-hours">校区加载中...</p>
            <div class="skills-container" id="display-auto-tags"></div>
            <a id="display-portfolio" class="portfolio-link" href="#" target="_blank" style="display: none;">🔗 查看我的作品集/主页</a>
            <div class="user-bio" id="display-bio">加载中...</div>
            <p class="user-tags" id="display-bio-mbti" style="margin-top:6px; display:none;"></p>
            <div id="display-feature-updated" style="font-size:12px; color:#9ca3af; margin-bottom:14px;"></div>
            <div id="action-btn-container"></div>
        </div>

        <div class="reviews-card">
            <div class="rating-header">
                <h2 style="font-size: 20px; margin: 0;">任务结项评价</h2>
                <div style="text-align: right;">
                    <div class="average-score" id="display-avg">0.0 <span style="font-size: 20px;">⭐</span></div>
                    <span style="color: #6b7280; font-size: 14px;">加权总分 / 星级</span>
                </div>
            </div>
            <div id="reviews-list">
                <p style="color: #9ca3af; text-align: center; padding: 20px;">暂无评价记录</p>
            </div>
            <div class="activity-board">
                <h3 style="font-size:17px; margin:0 0 12px 0; color:#111827;">我的活动</h3>
                <div class="activity-grid">
                    <div class="activity-col">
                        <strong style="font-size:14px; color:#111827;">进行中</strong>
                        <div id="ongoing-activities" style="margin-top:8px;"></div>
                    </div>
                    <div class="activity-col">
                        <strong style="font-size:14px; color:#111827;">历史活动</strong>
                        <div id="history-activities" style="margin-top:8px;"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="edit-modal" class="modal">
        <div class="modal-content">
            <h2 style="margin-bottom: 20px;">✍️ 编辑个人资料</h2>
            <input type="text" id="edit-dept" placeholder="院系 (如：信息与通信工程学院)">
            <input type="text" id="edit-grade" placeholder="年级 (如：2024级本科)">
            <select id="edit-campus">
                <option value="沙河校区">沙河校区</option>
                <option value="西土城校区">西土城校区</option>
            </select>
            <input type="text" id="edit-portfolio" placeholder="个人主页/作品集链接 (可选)">
            <textarea id="edit-bio" rows="4" placeholder="一句话介绍你的经历/技能/偏好，可选写入 MBTI（如：我是 INTJ）"></textarea>
            <div style="display: flex; gap: 10px; justify-content: flex-end;">
                <button onclick="closeModal('edit-modal')" style="background: #f3f4f6; color: #374151; padding: 10px 20px; border:none; border-radius: 8px; cursor: pointer;">取消</button>
                <button onclick="saveProfile()" style="background: #10b981; color: white; padding: 10px 20px; border:none; border-radius: 8px; font-weight: bold; cursor: pointer;">保存资料</button>
            </div>
        </div>
    </div>

    <div id="chat-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); justify-content:center; align-items:center; z-index:101;">
        <div style="background:white; width:90%; max-width:560px; border-radius:12px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column;">
            <div style="padding:14px 18px; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; gap:16px;">
                <strong id="chat-with" style="flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">聊天</strong>
                <button onclick="closeChat()" style="background:none;border:none;font-size:20px;cursor:pointer;color:#9ca3af;padding:0;width:auto;flex-shrink:0;">&times;</button>
            </div>
            <div id="chat-history" style="padding:16px; overflow:auto; flex:1; background:#f9fafb;"></div>
            <div style="padding:12px; border-top:1px solid #e5e7eb;">
                <input id="chat-input" type="text" placeholder="输入私信..." style="width:100%; padding:10px; border-radius:8px; border:1px solid #e5e7eb; box-sizing:border-box; margin-bottom:8px;" />
                <button onclick="sendChatMessage()" style="width:100%; padding:10px; border-radius:8px; background:#3b82f6; color:#fff; border:none; cursor:pointer; font-size:14px; font-weight:bold; box-sizing:border-box;">发送</button>
            </div>
        </div>
    </div>

    <script src="profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社区 - CampusMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page-body" data-cm-page="community">
    <div class="cm-app-shell">
        <aside class="cm-sidebar">
            <a class="cm-brand" href="dashboard.html">
                <span class="cm-brand-mark"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">school</span></span>
                <span>
                    <span class="cm-brand-title">CampusMatch</span>
                    <span class="cm-brand-subtitle">Academic Workspace</span>
                </span>
            </a>
            <nav class="cm-nav" aria-label="工作区">
                <button class="cm-nav-link" type="button" onclick="window.location.href='dashboard.html'">
                    <span class="material-symbols-outlined">dashboard</span> 首页
                </button>
                <button class="cm-nav-link" type="button" onclick="window.location.href='team_management.html'">
                    <span class="material-symbols-outlined">account_tree</span> 项目
                </button>
                <button class="cm-nav-link active" type="button">
                    <span class="material-symbols-outlined">groups</span> 社区
                </button>
                <button class="cm-nav-link" type="button" onclick="window.location.href='messages.html'">
                    <span class="material-symbols-outlined">chat</span> 消息
                </button>
            </nav>
            <div class="cm-sidebar-footer">
                <button class="cm-nav-link" type="button" onclick="window.location.href='profile.html'">
                    <span class="material-symbols-outlined">account_circle</span> 个人主页
                </button>
                <button class="cm-nav-link" type="button" onclick="localStorage.removeItem('currentUser'); window.location.href='index.html';">
                    <span class="material-symbols-outlined">logout</span> 退出登录
                </button>
            </div>
        </aside>

        <main class="cm-main">
            <header class="cm-topbar">
                <div>
                    <h1 id="community-welcome">社区广场</h1>
                    <p>分享动态、发现圈子，并和同伴连接。</p>
                </div>
                <div class="header-btns">
                    <button class="cm-button ghost" type="button" onclick="refreshCommunityData()">
                        <span class="material-symbols-outlined">refresh</span> 刷新
                    </button>
                </div>
            </header>

            <div class="dashboard-container">
                <div class="community-layout">
                    <!-- Feed Column -->
                    <div class="community-feed">
                        <!-- Post Composer -->
                        <div class="cm-glass-card">
                            <div class="community-composer">
                                <div class="cm-composer-avatar">
                                    <span class="material-symbols-outlined">person</span>
                                </div>
                                <div class="cm-composer-input" onclick="toggleComposer()" id="composer-trigger">
                                    <span class="cm-composer-placeholder">分享动态、论文或想法...</span>
                                    <span class="material-symbols-outlined" style="color:var(--outline);">share</span>
                                </div>
                            </div>

                            <!-- Expanded Composer Form -->
                            <div class="community-composer-form" id="community-composer-form">
                                <div class="field-stack">
                                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                                        <select id="community-post-circle">
                                            <option value="">公开发布</option>
                                        </select>
                                        <select id="community-post-project">
                                            <option value="">关联项目（可选）</option>
                                        </select>
                                    </div>
                                    <input id="community-post-title" type="text" placeholder="帖子标题">
                                    <textarea id="community-post-content" rows="4" placeholder="想说点什么？"></textarea>
                                    <div style="display:flex; justify-content:flex-end; gap:8px;">
                                        <button type="button" class="cm-button ghost" onclick="toggleComposer()">取消</button>
                                        <button type="button" class="btn-publish" onclick="createCommunityPost()">
                                            <span class="material-symbols-outlined">send</span> 发布
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Feed Posts -->
                        <div id="community-posts-container">
                            <p class="cm-muted-message">正在加载社区内容...</p>
                        </div>

                    </div>

                    <!-- Right Sidebar -->
                    <div class="community-sidebar">
                        <!-- Circle Discovery entry -->
                        <div class="cm-sidebar-card" style="text-align:center;">
                            <span class="material-symbols-outlined" style="font-size:40px;color:var(--primary);display:block;margin-bottom:8px;">groups</span>
                            <h3 style="margin-bottom:6px;">圈子发现</h3>
                            <p style="font-size:13px;color:var(--on-surface-variant);margin-bottom:14px;">浏览活跃圈子，支持提案，并加入讨论。</p>
                            <button class="cm-button" onclick="window.location.href='circles.html'" style="width:100%;">
                                <span class="material-symbols-outlined">explore</span> 浏览圈子
                            </button>
                        </div>

                        <!-- Community Recommendations -->
                        <div class="cm-sidebar-card">
                            <h3>为你推荐</h3>
                            <div id="community-recommendation-container">
                                <span class="cm-muted-message">计算中...</span>
                            </div>
                        </div>

                        <!-- Trending Topics -->
                        <div class="cm-sidebar-card">
                            <h3>热门话题</h3>
                            <div id="community-trending-container">
                                <p class="cm-muted-message">正在加载趋势...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="site_language.js"></script>
    <script src="community.js"></script>
</body>
</html>

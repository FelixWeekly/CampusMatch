<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Circle - CampusMatch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-page-body">
    <div class="cm-app-shell">
        <aside class="cm-sidebar">
            <a class="cm-brand" href="dashboard.html">
                <span class="cm-brand-mark"><span class="material-symbols-outlined" style="font-variation-settings:'FILL' 1;">school</span></span>
                <span>
                    <span class="cm-brand-title">CampusMatch</span>
                    <span class="cm-brand-subtitle">Academic Workspace</span>
                </span>
            </a>
            <nav class="cm-nav" aria-label="Workspace">
                <button class="cm-nav-link" type="button" onclick="window.location.href='dashboard.html'">
                    <span class="material-symbols-outlined">dashboard</span> Dashboard
                </button>
                <button class="cm-nav-link" type="button" onclick="window.location.href='team_management.html'">
                    <span class="material-symbols-outlined">account_tree</span> Projects
                </button>
                <button class="cm-nav-link active" type="button">
                    <span class="material-symbols-outlined">groups</span> Community
                </button>
                <button class="cm-nav-link" type="button" onclick="window.location.href='messages.html'">
                    <span class="material-symbols-outlined">chat</span> Messages
                </button>
            </nav>
            <div class="cm-sidebar-footer">
                <button class="cm-nav-link" type="button" onclick="window.location.href='profile.html'">
                    <span class="material-symbols-outlined">account_circle</span> Profile
                </button>
                <button class="cm-nav-link" type="button" onclick="localStorage.removeItem('currentUser'); window.location.href='index.html';">
                    <span class="material-symbols-outlined">logout</span> Log out
                </button>
            </div>
        </aside>

        <main class="cm-main">
            <header class="cm-topbar">
                <div>
                    <div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--outline);margin-bottom:2px;">
                        <a href="community.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Community</a>
                        <span class="material-symbols-outlined" style="font-size:14px;">chevron_right</span>
                        <a href="circles.html" style="color:var(--primary);text-decoration:none;font-weight:600;">Circles</a>
                        <span class="material-symbols-outlined" style="font-size:14px;">chevron_right</span>
                        <span id="circle-breadcrumb">Loading...</span>
                    </div>
                    <h1 id="circle-title">Circle</h1>
                    <p id="circle-desc" style="margin:0;">Loading circle details...</p>
                </div>
                <div class="header-btns" id="admin-actions" style="display:none;">
                    <button class="cm-button" style="background:var(--error);color:#fff;" onclick="deleteCircle()">
                        <span class="material-symbols-outlined">delete</span> Delete Circle
                    </button>
                </div>
            </header>

            <div class="dashboard-container" style="max-width:900px;">
                <!-- Circle Info Bar -->
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:24px;" id="circle-info-bar">
                    <span id="circle-post-count" style="font-weight:700;color:var(--primary);">0 posts</span>
                    <span style="color:var(--outline);">·</span>
                    <span id="circle-labels" style="display:flex;gap:6px;flex-wrap:wrap;"></span>
                </div>

                <!-- Compose -->
                <div class="cm-glass-card" style="margin-bottom:24px;padding:20px;">
                    <input id="compose-title" type="text" placeholder="Post title" style="width:100%;border:none;background:transparent;outline:none;font:inherit;font-weight:700;font-size:17px;margin-bottom:10px;">
                    <textarea id="compose-content" rows="3" placeholder="Write a post in this circle..." style="width:100%;border:none;background:transparent;resize:none;outline:none;font:inherit;"></textarea>
                    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
                        <button class="cm-button secondary" onclick="publishPost()">
                            <span class="material-symbols-outlined">send</span> Post
                        </button>
                    </div>
                </div>

                <!-- Posts Feed -->
                <div id="circle-feed">
                    <p class="cm-muted-message">Loading posts...</p>
                </div>
            </div>
        </main>
    </div>

    <script>
    const params = new URLSearchParams(window.location.search);
    const circleId = Number(params.get('id'));
    const currentUser = localStorage.getItem('currentUser') || '';

    if (!circleId) { alert('No circle specified'); window.location.href = 'circles.html'; }
    if (!currentUser) { alert('Please login first'); window.location.href = 'index.html'; }

    function esc(v) { return String(v || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function loadCircle() {
        try {
            const resp = await fetch(`http://localhost:3000/api/circles?user=${encodeURIComponent(currentUser)}`);
            const json = await resp.json();
            if (json.success) {
                const circle = (json.data || []).find(c => Number(c.id) === circleId);
                if (circle) {
                    document.getElementById('circle-title').textContent = circle.name;
                    document.getElementById('circle-desc').textContent = circle.description || '';
                    document.getElementById('circle-breadcrumb').textContent = circle.name;
                    document.getElementById('circle-post-count').textContent = `${circle.post_count || 0} posts`;
                    const labels = (circle.labels || '').split(/[,，\s]+/).filter(Boolean);
                    document.getElementById('circle-labels').innerHTML = labels.map(l =>
                        `<span style="background:var(--surface-container-high);padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600;">${esc(l)}</span>`
                    ).join('');
                    // Admin delete button
                    if (currentUser === 'Captain') {
                        document.getElementById('admin-actions').style.display = '';
                    }
                }
            }
        } catch (_) {}
    }

    async function loadFeed() {
        const feed = document.getElementById('circle-feed');
        try {
            const resp = await fetch(`http://localhost:3000/api/circles/${circleId}/feed?limit=40`);
            const json = await resp.json();
            if (json.success) {
                const posts = json.data || [];
                if (!posts.length) { feed.innerHTML = '<p class="cm-muted-message">No posts yet. Be the first!</p>'; return; }
                feed.innerHTML = posts.map(p => {
                    const tags = Array.isArray(p.tags) ? p.tags : [];
                    const sourceLabel = p.source === 'tag_match'
                        ? '<span style="font-size:11px;color:var(--secondary);background:rgba(16,185,129,0.1);padding:1px 8px;border-radius:8px;">Auto-matched</span>'
                        : '';
                    return `
                        <div class="cm-glass-card" style="margin-bottom:14px;padding:18px;">
                            <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
                                <a href="profile.html?user=${encodeURIComponent(p.author || '')}" style="font-weight:700;color:var(--primary);text-decoration:none;">${esc(p.author || 'anonymous')}</a>
                                ${sourceLabel}
                                <span style="margin-left:auto;font-size:12px;color:var(--outline);">${(p.created_at || '').split('T')[0]}</span>
                            </div>
                            <h3 style="margin:0 0 6px;font-size:17px;">${esc(p.title || '(no title)')}</h3>
                            <p style="margin:0 0 8px;color:var(--on-surface-variant);">${esc((p.content || '').slice(0, 200))}</p>
                            <div style="display:flex;gap:6px;flex-wrap:wrap;">${tags.map(t => `<span style="font-size:11px;background:var(--surface-container-high);padding:2px 8px;border-radius:8px;">${esc(t)}</span>`).join('')}</div>
                        </div>
                    `;
                }).join('');
            }
        } catch (_) { feed.innerHTML = '<p class="cm-muted-message">Failed to load posts</p>'; }
    }

    async function publishPost() {
        const title = document.getElementById('compose-title').value.trim();
        const content = document.getElementById('compose-content').value.trim();
        if (!title || !content) return alert('Please enter both title and content');
        try {
            const resp = await fetch('http://localhost:3000/api/community/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ author: currentUser, circle_id: circleId, title, content })
            });
            const json = await resp.json();
            if (json.success) {
                document.getElementById('compose-title').value = '';
                document.getElementById('compose-content').value = '';
                loadFeed();
                loadCircle();
            } else {
                alert(json.message || 'Failed to publish');
            }
        } catch (_) { alert('Network error'); }
    }

    async function deleteCircle() {
        if (!confirm('Delete this circle and ALL its posts? This cannot be undone.')) return;
        try {
            const resp = await fetch(`http://localhost:3000/api/circles/${circleId}`, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: currentUser })
            });
            const json = await resp.json();
            if (json.success) {
                alert('Circle deleted');
                window.location.href = 'circles.html';
            } else {
                alert(json.message || 'Failed to delete');
            }
        } catch (_) { alert('Network error'); }
    }

    window.onload = function () {
        loadCircle();
        loadFeed();
    };
    </script>
</body>
</html>
